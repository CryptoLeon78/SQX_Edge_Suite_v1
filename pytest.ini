[pytest]
testpaths = backend/sqx-edge-tool  backend/sqx-edge-relay
norecursedirs = backend/sqx-edge-tool/runtime  backend/sqx-edge-tool/venv
                backend/sqx-edge-relay/data  .git  .pytest_cache
                .playwright-cli  backups  dist
addopts = --tb=short --strict-markers
markers =
    smoke: pruebas rapidas de humo (arranque + contratos basicos de endpoints)
    integration: pruebas que requieren entorno/datos externos (data.db real, etc.)
