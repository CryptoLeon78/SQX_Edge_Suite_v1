# .gitlab-ci.yml — port de .github/workflows/tests.yml a GitLab (runners Linux)
# Paridad: compileall -> pytest+cobertura -> contratos JS -> e2e dashboard (allow_failure) -> whitespace
stages: [build, test, e2e, portal, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

compile:
  stage: build
  image: python:3.12
  script:
    - python -m compileall backend

whitespace:
  stage: build
  image: python:3.12
  script:
    - git diff --check

pytest:
  stage: test
  image: python:3.12
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths: [.cache/pip]
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
  script:
    - python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

js-contracts:
  stage: test
  image: node:22
  script:
    - |
      for f in tests/js/contracts/*.mjs; do
        [ -e "$f" ] || continue
        echo "contract: $f"
        node "$f"
      done

e2e:
  stage: e2e
  image: node:22
  allow_failure: true
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - node tests/ui_e2e/dashboard_smoke.mjs

# OpenNext build validation del Tester Portal (sin deploy).
# Prueba que templates/SQX_Edge_Tester_Portal compila para Cloudflare Workers.
portal-build:
  stage: portal
  image: node:22
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  rules:
    - changes:
        - templates/SQX_Edge_Tester_Portal/**/*
        - .gitlab-ci.yml
  cache:
    key: "npm-portal-$CI_COMMIT_REF_SLUG"
    paths: [templates/SQX_Edge_Tester_Portal/.npm]
  before_script:
    - cd templates/SQX_Edge_Tester_Portal
    - npm ci --cache .npm --prefer-offline
  script:
    - npx opennextjs-cloudflare build

# Deploy del Tester Portal a Cloudflare Workers (cuenta trading@).
# `when: manual` para el primer corte; quítalo para auto-on-main.
deploy-portal:
  stage: deploy
  image: node:22
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - templates/SQX_Edge_Tester_Portal/**/*
        - .gitlab-ci.yml
      when: manual
  before_script:
    - cd templates/SQX_Edge_Tester_Portal
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run cf:deploy
    - sleep 5
    - curl -fsS "https://sqx-edge-tester-portal-preview.rafael-fernandez-trading.workers.dev/api/health" -o health.json
    - cat health.json
    - grep -q '"ok":true' health.json
  environment:
    name: cloudflare-preview
    url: https://sqx-edge-tester-portal-preview.rafael-fernandez-trading.workers.dev