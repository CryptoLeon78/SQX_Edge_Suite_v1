<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQX Edge Readiness Panel</title>
  <script src="./fixtures/fixtures.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f4;
      --panel: #ffffff;
      --soft: #eef1ef;
      --text: #182027;
      --muted: #66717c;
      --line: #d7ded9;
      --accent: #0f766e;
      --blue: #2563eb;
      --good: #14763c;
      --good-bg: #e4f5ea;
      --warn: #9a5c00;
      --warn-bg: #fff0c8;
      --bad: #b42318;
      --bad-bg: #ffe4df;
      --radius: 8px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #10161d;
      --panel: #17212c;
      --soft: #22303d;
      --text: #edf2f7;
      --muted: #aeb8c5;
      --line: #354455;
      --accent: #2dd4bf;
      --blue: #60a5fa;
      --good: #4ade80;
      --good-bg: #173d2b;
      --warn: #facc15;
      --warn-bg: #473c16;
      --bad: #fb7185;
      --bad-bg: #4b1d28;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.42;
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 16px 0 20px;
    }

    .topbar,
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar { margin-bottom: 12px; }

    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .version {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 6px 10px;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(430px, 1.4fr) minmax(260px, 0.8fr);
      gap: 10px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      letter-spacing: 0;
    }

    .body {
      display: grid;
      gap: 10px;
      padding: 12px 14px 14px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric,
    .status-card,
    .guard,
    .check {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
      padding: 9px;
      min-width: 0;
    }

    .metric .label,
    .kv .label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .metric .value {
      display: block;
      min-height: 22px;
      font-size: 18px;
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .kv {
      display: grid;
      grid-template-columns: minmax(82px, auto) minmax(0, 1fr);
      gap: 8px;
      align-items: baseline;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--line);
    }

    .kv:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .kv .value {
      text-align: right;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      width: max-content;
      max-width: 100%;
      min-height: 30px;
      border-radius: 6px;
      padding: 6px 9px;
      font-weight: 780;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .ready { color: var(--good); background: var(--good-bg); }
    .review { color: var(--warn); background: var(--warn-bg); }
    .blocked { color: var(--bad); background: var(--bad-bg); }
    .info { color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }

    .check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      background: var(--muted);
    }

    .dot.ready { background: var(--good); }
    .dot.review { background: var(--warn); }
    .dot.blocked { background: var(--bad); }

    .check strong,
    .guard strong {
      display: block;
      margin-bottom: 2px;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .footer {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
    }

    @media (max-width: 520px) {
      main { width: min(100vw - 18px, 1180px); padding-top: 10px; }
      .metric-grid { grid-template-columns: 1fr; }
      .kv { grid-template-columns: 1fr; }
      .kv .value { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <h1>SQX Edge Readiness Panel</h1>
        <div class="version" data-version></div>
      </div>
      <nav class="toolbar" aria-label="Fixtures and display">
        <button type="button" data-fixture="ready">Ready</button>
        <button type="button" data-fixture="review">Review</button>
        <button type="button" data-fixture="blocked">Blocked</button>
        <button type="button" data-theme-toggle>Theme</button>
      </nav>
    </header>

    <section class="layout" aria-live="polite">
      <article class="panel">
        <h2>Context</h2>
        <div class="body" data-context></div>
      </article>

      <article class="panel">
        <h2>Readiness</h2>
        <div class="body">
          <div class="status-card">
            <div class="row">
              <span class="badge blocked" data-readiness>Blocked</span>
              <span class="muted" data-source>offline fixture</span>
            </div>
            <p class="muted" data-readiness-detail></p>
          </div>
          <div class="metric-grid" data-metrics></div>
          <div data-checks></div>
        </div>
      </article>

      <article class="panel">
        <h2>SAFE2 Gate</h2>
        <div class="body" data-guards></div>
      </article>
    </section>
    <div class="footer">SQX Edge-owned extension surface. No engine, data.db, databank, project, license or runtime mutation.</div>
  </main>

  <script>
    (function () {
      "use strict";

      const VERSION = "sqx142-internal-safe2-readiness-panel-v1";
      const state = {
        theme: "light",
        strategy: null,
        stats: null,
        settings: null,
        symbol: null,
        fixture: null,
        source: "offline fixture",
        received: []
      };

      const thresholds = {
        minTrades: 80,
        minProfitFactor: 1.05,
        minExpectancy: 0.05,
        minReturnDd: 1.0
      };

      const guards = [
        ["Extension surface", "user/extend/ResultsPlugins"],
        ["Backup", "required before install"],
        ["Rollback", "scripted from backup manifest"],
        ["SQX runtime", "must stay closed"],
        ["data.db", "read-only boundary"],
        ["user/projects", "not written"],
        ["MT5 import", "blocked here"],
        ["Migration Tool", "blocked here"]
      ];

      const $ = (selector) => document.querySelector(selector);
      const text = (value, fallback) => value === undefined || value === null || value === "" ? fallback : String(value);
      const num = (key) => Number(state.stats && state.stats[key]);
      const fmt = (value, digits) => Number.isFinite(Number(value)) ? Number(value).toLocaleString("en-US", { maximumFractionDigits: digits, minimumFractionDigits: digits }) : "-";

      function status(ok, warn) {
        if (ok) return "ready";
        return warn ? "review" : "blocked";
      }

      function buildChecks() {
        const trades = num("NumberOfTrades");
        const pf = num("ProfitFactor");
        const exp = num("RExpectancy");
        const rdd = num("ReturnDDRatio");
        return [
          {
            label: "Trades",
            state: status(Number.isFinite(trades) && trades >= thresholds.minTrades, Number.isFinite(trades) && trades >= 30),
            detail: `${fmt(trades, 0)} / ${thresholds.minTrades}+`
          },
          {
            label: "Profit Factor",
            state: status(Number.isFinite(pf) && pf >= thresholds.minProfitFactor, Number.isFinite(pf) && pf >= 1),
            detail: `${fmt(pf, 2)} / ${fmt(thresholds.minProfitFactor, 2)}+`
          },
          {
            label: "RExpectancy",
            state: status(Number.isFinite(exp) && exp >= thresholds.minExpectancy, Number.isFinite(exp) && exp > 0),
            detail: `${fmt(exp, 3)} / ${fmt(thresholds.minExpectancy, 2)}+`
          },
          {
            label: "ReturnDDRatio",
            state: status(Number.isFinite(rdd) && rdd >= thresholds.minReturnDd, Number.isFinite(rdd) && rdd > 0),
            detail: `${fmt(rdd, 2)} / ${fmt(thresholds.minReturnDd, 2)}+`
          }
        ];
      }

      function readiness(checks) {
        if (!state.strategy || !state.stats) {
          return ["blocked", "Waiting for strategy and stats payloads."];
        }
        if (checks.some((check) => check.state === "blocked")) {
          return ["blocked", "One or more hard readiness checks failed."];
        }
        if (checks.some((check) => check.state === "review")) {
          return ["review", "Candidate needs operator review before promotion."];
        }
        return ["ready", "Candidate passes the local readiness screen."];
      }

      function kv(label, value) {
        return `<div class="kv"><span class="label">${label}</span><span class="value">${text(value, "-")}</span></div>`;
      }

      function metric(label, value) {
        return `<div class="metric"><span class="label">${label}</span><span class="value">${value}</span></div>`;
      }

      function render() {
        const checks = buildChecks();
        const [readyState, detail] = readiness(checks);
        document.documentElement.dataset.theme = state.theme;
        $("[data-version]").textContent = VERSION;
        $("[data-source]").textContent = state.source;
        const readinessNode = $("[data-readiness]");
        readinessNode.className = `badge ${readyState}`;
        readinessNode.textContent = readyState;
        $("[data-readiness-detail]").textContent = detail;

        const strategy = state.strategy || {};
        const symbol = state.symbol || {};
        $("[data-context]").innerHTML = [
          kv("Strategy", strategy.name || strategy.id),
          kv("Project", strategy.projectName),
          kv("Databank", strategy.databankName),
          kv("Symbol", symbol.symbol || strategy.symbol),
          kv("Timeframe", symbol.timeframe || strategy.timeframe),
          kv("Precision", symbol.precision),
          kv("Timezone", symbol.timezone)
        ].join("");

        const stats = state.stats || {};
        $("[data-metrics]").innerHTML = [
          metric("NetProfit", fmt(stats.NetProfit, 2)),
          metric("Trades", fmt(stats.NumberOfTrades, 0)),
          metric("ProfitFactor", fmt(stats.ProfitFactor, 2)),
          metric("RExpectancy", fmt(stats.RExpectancy, 3)),
          metric("ReturnDDRatio", fmt(stats.ReturnDDRatio, 2)),
          metric("Drawdown", fmt(stats.Drawdown || stats.PctDrawdown, 2))
        ].join("");

        $("[data-checks]").innerHTML = checks.map((check) => (
          `<div class="check"><span class="dot ${check.state}"></span><div><strong>${check.label}</strong><span class="muted">${check.detail}</span></div></div>`
        )).join("");

        $("[data-guards]").innerHTML = guards.map((guard) => (
          `<div class="guard"><strong>${guard[0]}</strong><span class="muted">${guard[1]}</span></div>`
        )).join("");

        document.querySelectorAll("[data-fixture]").forEach((button) => {
          button.classList.toggle("active", button.dataset.fixture === state.fixture);
        });
      }

      function sendSqxMessage(type, payload) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type, payload: payload || {} }, "*");
        }
      }

      function receiveSqxMessage(message) {
        if (!message || typeof message !== "object") return;
        state.received.push(message.type || "UNKNOWN");
        switch (message.type) {
          case "STRATEGY_DATA":
            state.strategy = message.payload || {};
            state.source = state.fixture ? "offline fixture" : "SQX postMessage";
            if (state.strategy.id) {
              sendSqxMessage("GET_STATS", { strategyId: state.strategy.id });
              sendSqxMessage("GET_LAST_SETTINGS_XML", { strategyId: state.strategy.id });
            }
            if (state.strategy.symbol || state.strategy.timeframe) {
              sendSqxMessage("GET_SYMBOL_INFO", { symbol: state.strategy.symbol, timeframe: state.strategy.timeframe });
            }
            break;
          case "STATS_RESPONSE":
            state.stats = message.payload || {};
            break;
          case "LAST_SETTINGS_XML_RESPONSE":
            state.settings = message.payload || {};
            break;
          case "SYMBOL_INFO_RESPONSE":
            state.symbol = message.payload || {};
            break;
          case "SET_THEME":
            state.theme = message.payload && message.payload.theme === "dark" ? "dark" : "light";
            break;
          default:
            break;
        }
        render();
      }

      function loadFixture(name) {
        const fixture = window.SQX_EDGE_FIXTURES && window.SQX_EDGE_FIXTURES[name];
        if (!fixture) return;
        state.strategy = null;
        state.stats = null;
        state.settings = null;
        state.symbol = null;
        state.received = [];
        state.fixture = name;
        state.source = "offline fixture";
        fixture.messages.forEach(receiveSqxMessage);
      }

      window.addEventListener("message", (event) => receiveSqxMessage(event.data));
      document.querySelectorAll("[data-fixture]").forEach((button) => {
        button.addEventListener("click", () => loadFixture(button.dataset.fixture));
      });
      $("[data-theme-toggle]").addEventListener("click", () => {
        receiveSqxMessage({ type: "SET_THEME", payload: { theme: state.theme === "dark" ? "light" : "dark" } });
      });

      window.SQX_EDGE_READINESS_PANEL_VERSION = VERSION;
      window.__SQX_EDGE_PANEL__ = {
        version: VERSION,
        receiveSqxMessage,
        loadFixture,
        getReadiness: () => readiness(buildChecks())[0],
        getState: () => JSON.parse(JSON.stringify(state))
      };

      loadFixture("ready");
    })();
  </script>
</body>
</html>
