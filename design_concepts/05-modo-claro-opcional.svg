  <rect x="1047" y="38" width="82" height="32" rx="8" fill="#ecfdf5" stroke="#99f6e4"/>
  <text x="1067" y="58" class="chip">LIVE</text>
  <rect x="1140" y="38" width="82" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1161" y="58" class="navActive">Export</text>

  <text x="52" y="130" class="nav">Por Activo</text>
  <text x="164" y="130" class="navActive">Por Categoria</text>
  <text x="301" y="130" class="nav">Filtros Fase 2</text>
  <text x="438" y="130" class="nav">SQX Priority</text>
  <text x="568" y="130" class="nav">Pipeline</text>
  <text x="671" y="130" class="nav">Roadmap</text>
  <rect x="155" y="146" width="120" height="3" rx="2" fill="url(#accent)"/>

  <rect x="52" y="168" width="240" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="195" class="label">SETUP</text>
  <text x="72" y="222" class="num">8 bloques cerrados</text>
  <rect x="316" y="168" width="240" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="336" y="195" class="label">SENAL</text>
  <text x="336" y="222" class="num">142 activos</text>
  <rect x="580" y="168" width="240" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="195" class="label">RIESGO</text>
  <text x="600" y="222" class="num">Normal</text>
  <rect x="844" y="168" width="360" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="864" y="195" class="label">FLUJO</text>
  <text x="864" y="222" class="num">Fase 1 preparada</text>

  <rect x="52" y="266" width="760" height="404" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
