<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <style>
      .title{font:700 23px Segoe UI,Arial,sans-serif;fill:#0f172a}
      .sub{font:500 12px Segoe UI,Arial,sans-serif;fill:#64748b}
      .nav{font:700 13px Segoe UI,Arial,sans-serif;fill:#64748b}
      .navActive{font:800 13px Segoe UI,Arial,sans-serif;fill:#2563eb}
      .label{font:800 11px Segoe UI,Arial,sans-serif;fill:#475569}
      .text{font:700 14px Segoe UI,Arial,sans-serif;fill:#0f172a}
      .small{font:600 11px Segoe UI,Arial,sans-serif;fill:#64748b}
      .num{font:800 22px Segoe UI,Arial,sans-serif;fill:#0f172a}
      .chip{font:800 11px Segoe UI,Arial,sans-serif;fill:#0f766e}
      .mono{font:700 12px Consolas,monospace;fill:#334155}
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>

  <rect x="24" y="22" width="1232" height="716" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="24" y="22" width="1232" height="72" rx="18" fill="#ffffff"/>
  <rect x="24" y="92" width="1232" height="1" fill="#e2e8f0"/>

