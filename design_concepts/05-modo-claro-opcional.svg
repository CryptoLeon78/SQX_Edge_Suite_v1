  <rect x="868" y="356" width="312" height="78" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
  <text x="892" y="384" class="label">PALETA</text>
  <circle cx="902" cy="410" r="10" fill="#2563eb"/>
  <circle cx="930" cy="410" r="10" fill="#0f766e"/>
  <circle cx="958" cy="410" r="10" fill="#f59e0b"/>
  <circle cx="986" cy="410" r="10" fill="#e11d48"/>
  <circle cx="1014" cy="410" r="10" fill="#64748b"/>

  <rect x="868" y="458" width="312" height="164" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
  <text x="892" y="488" class="label">TRAZABILIDAD</text>
  <text x="892" y="522" class="mono">state.ui.theme = light</text>
  <text x="892" y="552" class="mono">categories.expanded = false</text>
  <text x="892" y="582" class="mono">filters.persisted = true</text>

  <rect x="52" y="696" width="1152" height="1" fill="#e2e8f0"/>
