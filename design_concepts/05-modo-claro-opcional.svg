    <text x="22" y="28" class="navActive">T</text>
    <text x="54" y="27" class="text">Tendencia</text>
    <text x="178" y="27" class="small">EMA, MACD, Ichimoku, SuperTrend</text>
    <text x="650" y="27" class="small">21 activos  ></text>
  </g>
  <g transform="translate(76 396)">
