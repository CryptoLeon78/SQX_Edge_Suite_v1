    <text x="54" y="27" class="text">Momentum</text>
    <text x="178" y="27" class="small">RSI, Stochastic, CCI, ROC</text>
    <text x="650" y="27" class="small">22 activos  ></text>
  </g>
  <g transform="translate(76 452)">
    <rect width="712" height="42" rx="9" fill="#f8fafc" stroke="#dbe4ef"/>
    <rect x="14" y="10" width="24" height="24" rx="6" fill="#ffedd5"/>
    <text x="21" y="28" style="font:800 13px Segoe UI,Arial,sans-serif;fill:#ea580c">V</text>
    <text x="54" y="27" class="text">Volatilidad</text>
    <text x="178" y="27" class="small">Bollinger, Keltner, Donchian</text>
    <text x="650" y="27" class="small">18 activos  ></text>
  </g>
  <g transform="translate(76 508)">
    <rect width="712" height="42" rx="9" fill="#f8fafc" stroke="#dbe4ef"/>
    <rect x="14" y="10" width="24" height="24" rx="6" fill="#f3e8ff"/>
    <text x="21" y="28" style="font:800 13px Segoe UI,Arial,sans-serif;fill:#9333ea">R</text>
    <text x="54" y="27" class="text">Regimen</text>
    <text x="178" y="27" class="small">Market regime, Entropy, Hilbert</text>
    <text x="650" y="27" class="small">17 activos  ></text>
  </g>
  <g transform="translate(76 564)">
    <rect width="712" height="42" rx="9" fill="#f8fafc" stroke="#dbe4ef"/>
    <rect x="14" y="10" width="24" height="24" rx="6" fill="#cffafe"/>
    <text x="20" y="28" style="font:800 13px Segoe UI,Arial,sans-serif;fill:#0891b2">W</text>
    <text x="54" y="27" class="text">Volumen</text>
    <text x="178" y="27" class="small">VWAP, AvgVolume</text>
    <text x="650" y="27" class="small">11 activos  ></text>
  </g>

  <rect x="844" y="266" width="360" height="404" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="868" y="303" class="text">Lectura limpia</text>
